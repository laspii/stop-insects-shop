<!DOCTYPE html>
<html lang="uk">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Служба відновлення дому</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="brand-title" id="brandTitle">Служба відновлення дому</div>
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('uk')">UA</button>
            <button class="lang-btn" onclick="setLanguage('ru')">RU</button>
        </div>
    </header>

    <div id="main-view">
        <div class="hero-text" id="heroText">
            Ми повертаємо відчуття безпеки та контролю.
        </div>
        <div class="product-grid" id="productList"></div>
    </div>

    <div id="checkout-view" class="hidden">
        <h2 id="checkoutTitle">Оформлення замовлення</h2>
        
        <div class="cart-summary" id="cartSummary"></div>

        <form id="orderForm">
            <h3 id="contactTitle">Контактні дані</h3>
            <input type="tel" id="phone" placeholder="+380..." required>
            <input type="text" id="firstName" placeholder="Ім'я" required>
            <input type="text" id="lastName" placeholder="Прізвище" required>

            <h3 id="deliveryTitle">Доставка Нова Пошта</h3>
            <input type="text" id="cityInput" placeholder="Місто (напр. Харків)" required>
            <input type="text" id="branchInput" placeholder="№ Відділення або адреса" required>
        </form>
    </div>

    <div id="success-view" class="hidden" style="text-align: center; padding: 40px 20px;">
        <div style="font-size: 50px; margin-bottom: 20px;">✅</div>
        <h2 id="successTitle">Замовлення прийнято!</h2>
        <p id="successDesc">Менеджер зв'яжеться з вами найближчим часом.</p>
        <button onclick="downloadPDF()" class="add-btn" style="margin-top: 20px; background-color: #ef4444;">
            📄 Завантажити чек (PDF)
        </button>
        <br><br>
        <button onclick="closeApp()" class="lang-btn" style="font-size: 14px; text-decoration: underline;">
            Закрити магазин
        </button>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
